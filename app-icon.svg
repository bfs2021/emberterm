<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Ember flame icon — centered in 512×512 canvas.
    Original flame coords: x=2..14, y=0..18 (12×18 in a 16×20 viewBox).
    Scale = min(416/12, 416/18) = 23.11 → flame fills 277×416.
    Offset: x=(512-277)/2=117.35, y=(512-416)/2=48
    Transform: translate(71.13, 48) scale(23.11)  [71.13 = 117.35 - 2*23.11]
  -->
  <g transform="translate(71.13, 48) scale(23.11)">
    <path d="M8 0 C8 0, 14 5, 14 11 C14 15.4 11.3 18 8 18 C4.7 18 2 15.4 2 11 C2 7 6 3 6 3 C6 3 6 7 8 8 C8 8 10 6 8 0Z" fill="#FF6B35"/>
    <path d="M8 9 C8 9, 10 10.5 10 13 C10 14.7 9.1 16 8 16 C6.9 16 6 14.7 6 13 C6 11 8 9 8 9Z" fill="rgba(255,255,255,0.45)"/>
  </g>
</svg>
