[package]
name = "emberterm"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
portable-pty = "0.9"
termwiz = "0.23"
# wezterm-term: git dep from the wezterm monorepo; integration deferred.
# Uses branch = "main" — pin to a specific rev once integration begins.
# When enabling the `wezterm` feature, also add [patch.crates-io] to override
# termwiz with the same git source to prevent duplicate-crate link errors.
wezterm-term = { git = "https://github.com/wezterm/wezterm", branch = "main", optional = true }
toml = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
notify = "6"
window-vibrancy = "0.6"
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[features]
default = []
# Enable the wezterm-term VT model; requires network access when building.
wezterm = ["dep:wezterm-term"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
ts-rs = { version = "10", features = ["serde-compat"] }
proptest = "1"

[[bench]]
name = "osc_parser"
harness = false

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
