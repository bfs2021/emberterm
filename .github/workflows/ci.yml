name: CI

# Only after a merge: PRs are checked locally before they are opened or marked ready for review
# (CONTRIBUTING.md, "Before you open a PR").
on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: packages/desktop

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev libglib2.0-dev

      - name: cargo fmt
        working-directory: packages/desktop
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: packages/desktop
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: packages/desktop
        run: cargo test --all

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The version comes from "packageManager" in package.json; passing one here as
      # well makes the action fail with "Multiple versions of pnpm specified".
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Versions agree
        run: node scripts/version.mjs check

      - name: Type check
        run: pnpm turbo check

      - name: Build
        run: pnpm turbo build

      - name: Test
        run: pnpm turbo test
