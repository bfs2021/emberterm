name: Release

# Push a tag like v0.2.0 after `pnpm version:set 0.2.0` and merging it (see CONTRIBUTING.md).
# Builds the Windows installer and a universal macOS app, signs the updates with
# TAURI_SIGNING_PRIVATE_KEY and publishes latest.json, which the in-app "Check for updates" button reads.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Every job merges its platform into the release's latest.json; run in parallel, one job
      # could overwrite the other's entry.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            args: ""
            rust-targets: ""
          # One app for Intel and Apple Silicon. Ad-hoc signed (tauri.conf.json), not notarized:
          # Gatekeeper asks for confirmation on first launch.
          - os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: packages/desktop

      - run: pnpm install --frozen-lockfile

      # A tag that disagrees with the files would publish an installer labelled with the wrong version.
      - run: node scripts/version.mjs check ${{ github.ref_name }}

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: packages/desktop
          tagName: ${{ github.ref_name }}
          releaseName: EmberTerm ${{ github.ref_name }}
          releaseDraft: false
          includeUpdaterJson: true
          # Point the Windows updater at the NSIS installer instead of the MSI.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
