name: Release

# Push a tag like v0.2.0 after `pnpm version:set 0.2.0` and merging it (see CONTRIBUTING.md).
# Builds the Windows installer and a universal macOS app, signs the updates with
# TAURI_SIGNING_PRIVATE_KEY and publishes latest.json, which the in-app "Check for updates" button reads.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Every job merges its platform into the release's latest.json; run in parallel, one job
      # could overwrite the other's entry.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            args: ""
            rust-targets: ""
          # One app for Intel and Apple Silicon. Ad-hoc signed (tauri.conf.json), not notarized:
          # Gatekeeper asks for confirmation on first launch.
          - os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: packages/desktop

      - run: pnpm install --frozen-lockfile

      # A tag that disagrees with the files would publish an installer labelled with the wrong version.
      - run: node scripts/version.mjs check ${{ github.ref_name }}

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: packages/desktop
          tagName: ${{ github.ref_name }}
          releaseName: EmberTerm ${{ github.ref_name }}
          releaseDraft: false
          includeUpdaterJson: true
          # Point the Windows updater at the NSIS installer instead of the MSI.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
